<!doctype html>
<!--
  og-image.png uchun shablon (1200×630).
  Matnni o'zgartirgach, PNG'ni qayta yasash (Windows, PowerShell):
    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --virtual-time-budget=5000 --window-size=1200,630 --screenshot="og-image.png" "file:///<to'liq yo'l>/assets/og-image.html"
-->
<html lang="uz">
<head>
  <meta charset="utf-8">
  <title>og-image</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Caveat:wght@700&family=Inter:wght@500;600&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; font-family: "Inter", sans-serif; color: #fff;
      background:
        radial-gradient(ellipse 60% 45% at 72% 70%, rgba(240, 150, 80, .45), transparent 70%),
        linear-gradient(180deg, #231c2b 0%, #4a2f3a 32%, #9a5a3f 58%, #3a2820 78%, #140f0c 100%);
    }
    .city { position: absolute; left: 0; bottom: 0; width: 1200px; height: 210px; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15,10,8,.55) 0%, rgba(15,10,8,.15) 65%, rgba(15,10,8,0) 100%); }
    .content { position: absolute; left: 72px; top: 64px; right: 72px; }

    .brand { display: flex; align-items: center; gap: 18px; }
    .brand svg { width: 76px; height: 76px; filter: drop-shadow(3px 3px 0 #b08544); }
    .brand-name { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: .5px; line-height: 1.1; }
    .brand-sub { font-size: 19px; font-weight: 600; color: #e6c48f; }

    .sticker {
      display: inline-block; margin-top: 52px; padding: 4px 18px; border-radius: 999px; transform: rotate(-3deg);
      background: #ecdcbf; color: #5a3a28; box-shadow: 3px 4px 0 #b08544;
      font-family: "Caveat", cursive; font-weight: 700; font-size: 28px;
    }
    h1 {
      margin-top: 22px; max-width: 820px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
      font-size: 86px; line-height: 1; letter-spacing: -1.5px; text-shadow: 4px 5px 0 rgba(20, 14, 10, .85);
    }
    .services { margin-top: 26px; font-size: 27px; font-weight: 600; color: rgba(255, 255, 255, .9); }
    .services span { color: #e6c48f; margin: 0 10px; }

    .phone {
      position: absolute; right: 72px; top: 76px; display: flex; align-items: center; gap: 12px;
      padding: 14px 26px; border-radius: 999px; background: #f6eee2; color: #2b231d;
      box-shadow: 4px 5px 0 #b08544; font-size: 26px; font-weight: 600;
    }
    .phone svg { width: 26px; height: 26px; }
  </style>
</head>
<body>
  <svg class="city" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <pattern id="win" width="44" height="52" patternUnits="userSpaceOnUse">
        <rect x="6" y="8" width="7" height="10" fill="#f2c27a" opacity=".55"/>
        <rect x="28" y="8" width="7" height="10" fill="#f2c27a" opacity=".2"/>
        <rect x="17" y="34" width="7" height="10" fill="#f2c27a" opacity=".4"/>
        <rect x="36" y="34" width="7" height="10" fill="#f2c27a" opacity=".12"/>
      </pattern>
      <g id="city">
        <rect x="0" y="150" width="70" height="110"/>
        <rect x="70" y="110" width="60" height="150"/>
        <rect x="130" y="170" width="90" height="90"/>
        <rect x="220" y="80" width="50" height="180"/>
        <rect x="270" y="130" width="80" height="130"/>
        <rect x="350" y="60" width="46" height="200"/>
        <rect x="396" y="140" width="70" height="120"/>
        <rect x="466" y="100" width="84" height="160"/>
        <rect x="550" y="176" width="72" height="84"/>
        <path d="M552 177 Q586 118 620 177 Z"/>
        <rect x="622" y="40" width="54" height="220"/>
        <rect x="676" y="120" width="84" height="140"/>
        <rect x="760" y="90" width="60" height="170"/>
        <rect x="820" y="150" width="90" height="110"/>
        <rect x="910" y="70" width="52" height="190"/>
        <rect x="962" y="130" width="76" height="130"/>
        <rect x="1038" y="100" width="64" height="160"/>
        <rect x="1102" y="160" width="98" height="100"/>
      </g>
    </defs>
    <use href="#city" fill="#120d0a"/>
    <use href="#city" fill="url(#win)"/>
  </svg>
  <div class="shade"></div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="32" fill="#5a3a28"/>
        <path d="M15 19V45M15 19H22A6.5 6.5 0 0 1 22 32H15M15 32H23A6.5 6.5 0 0 1 23 45H15M38 19V45M38 19H49.5M38 32H47.5M38 45H49.5" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square"/>
      </svg>
      <div>
        <div class="brand-name">"BIZNES EKSPERT BAHO" MCHJ</div>
        <div class="brand-sub">Baholash tashkiloti · O'zbekiston</div>
      </div>
    </div>

    <span class="sticker">Xolis. Aniq. Ishonchli.</span>
    <h1>Mulkni xolis baholash</h1>
    <div class="services">Ko'chmas mulk<span>•</span>Ko'char mulk<span>•</span>Biznes reja</div>
  </div>

  <div class="phone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    +998 93 433 93 51
  </div>
</body>
</html>
